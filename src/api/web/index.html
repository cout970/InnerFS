<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Webdav</title>
    <link rel="stylesheet" href="src/style.scss">
</head>
<body>

<div class="app">

            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
</div>

<script type="module" src="src/main.js"></script>
