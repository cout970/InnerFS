[package]
name = "InnerFS"
version = "2.0.0"
edition = "2021"

[dependencies]
sqlite = "0.36.1"
serde_yml = "0.0.12"
serde_json = "1.0.127"
serde = { version = "1.0.209", features = ["derive", "rc"] }
anyhow = "1.0.86"
cntr-fuse = "0.4.2"
hmac-sha512 = "1.1.5"
itertools = "0.13.0"
libc = "0.2.155"
time = "0.3.37"
hex = "0.4.3"
log = "0.4.22"
env_logger = "0.11.5"
aws-sdk-s3 = { version = "1.46.0", features = ["behavior-version-latest"] }
aws-config = "1.5.10"
aws-smithy-types = "1.2.2"
aws-smithy-runtime = "1.7.4"
aws-types = "1.3.3"
http = "1.2.0"
tokio = { version = "1.39.3", features = ["full"] }
tiny_http = "0.12.0"
xml_dom = "0.2.8"
aes-gcm = "0.10.3"
pbkdf2 = { version = "0.12.2", features = ["hmac", "std"] }
sha2 = "0.10.8"
clap = { version = "4.5.16", features = ["derive"] }
zip = "2.2.0"
tar = "0.4.41"
flate2 = "1.0.33"
signal-hook = "0.3.17"
rocksdb = "0.22.0"
rpassword = "7.3.1"
regex = "1.10.6"
chrono = "0.4.39"
mime_guess = "2.0.5"
url = "2.5.2"
percent-encoding = "2.3.1"
rayon = "1.11.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.13.3"
minilzo = "0.2.0"